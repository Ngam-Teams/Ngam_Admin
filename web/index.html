  <script>
    window.ngamReloadPwa = function(versionTag) {
      try {
        var ver = versionTag || Date.now().toString();
        var doReload = function() {
          try {
            var url = new URL(window.location.href);
            url.searchParams.set('_v', ver);
            window.location.replace(url.toString());
          } catch (e) {
            window.location.reload();
          }
        };
        var tasks = [];
        if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
          tasks.push(
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              return Promise.all(regs.map(function(reg) {
                return reg.unregister();
              }));
            }).catch(function() {})
          );
        }
        if ('caches' in window && window.caches && window.caches.keys) {
          tasks.push(
            window.caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) {
                return window.caches.delete(k);
              }));
            }).catch(function() {})
          );
        }
        if (tasks.length > 0) {
          Promise.all(tasks).finally(doReload);
        } else {
          doReload();
        }
      } catch (e) {
        window.location.reload();
      }
    };
  </script>
  <style>
    html, body {
      background-color: #000000;

      width: 100%;

    #ngam-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      z-index: 99999;
      transition: opacity 0.35s ease-out;
      user-select: none;
    }
    .splash-logo {
      width: 76px;
      height: 76px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(33, 150, 243, 0.25);
      animation: splash-pulse 2s infinite ease-in-out;
    }
    @keyframes splash-pulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.04); opacity: 1; filter: drop-shadow(0 0 16px rgba(33, 150, 243, 0.45)); }
    }
    /* Sembunyikan #ngam-splash jika dibuka sebagai PWA Standalone di Android/iOS */
    @media (display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui) {
      #ngam-splash {
        display: none !important;
      }
    }
  </style>
  <script>
    (function() {
      var isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                         window.navigator.standalone === true ||
                         document.referrer.includes('android-app://');
      if (isStandalone) {
        var style = document.createElement('style');
        style.textContent = '#ngam-splash { display: none !important; }';
        document.head.appendChild(style);
      }
    })();
  </script>

<body style="background-color: #000000;">
  <div id="ngam-splash">
    <img src="icons/splash-logo.png" alt="Ngam Admin" class="splash-logo">
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('ngam-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 350);
      }
    });
  </script>
