name: ngam_admin
description: "Ngam Admin – Super Admin portal for the multi-tenant SaaS ecosystem."
publish_to: 'none'
version: 0.1.26+9

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Supabase backend
  supabase_flutter: ^2.8.4

  # Navigation
  go_router: ^15.1.2

  # State management
  flutter_riverpod: ^2.6.1

  # UI utilities (frosted glass)
  flutter_svg: ^2.0.10+1
  hugeicons: ^1.1.7
  http: ^1.6.0
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.2
  intl: ^0.20.2
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/app.png"

flutter_native_splash:
  color: "#ffffff"
  color_dark: "#0b0b0b"
  image: "assets/splash.png"
  image_dark: "assets/splash.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/app.png
    - assets/splash.png
