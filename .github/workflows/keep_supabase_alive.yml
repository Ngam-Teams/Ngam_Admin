name: Keep Supabase Alive

on:
  schedule:
    # Run at 00:00 UTC every 3 days to keep the project active
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows you to manually trigger the workflow from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Pinging Supabase to prevent project pausing..."
          curl -s -X GET "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" > /dev/null
          echo "Done!"
