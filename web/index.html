  <script>
    window.ngamReloadPwa = function(versionTag) {
      try {
        var ver = versionTag || Date.now().toString();
        var doReload = function() {
          try {
            var url = new URL(window.location.href);
            url.searchParams.set('_v', ver);
            window.location.replace(url.toString());
          } catch (e) {
            window.location.reload();
          }
        };
        var tasks = [];
        if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
          tasks.push(
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              return Promise.all(regs.map(function(reg) {
                return reg.unregister();
              }));
            }).catch(function() {})
          );
        }
        if ('caches' in window && window.caches && window.caches.keys) {
          tasks.push(
            window.caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) {
                return window.caches.delete(k);
              }));
            }).catch(function() {})
          );
        }
        if (tasks.length > 0) {
          Promise.all(tasks).finally(doReload);
        } else {
          doReload();
        }
      } catch (e) {
        window.location.reload();
      }
    };
  </script>
